name: cabdesk

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (run make init)}"
      POSTGRES_DB: cab_booking
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cab_booking"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend
    logging: *default-logging

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend
    logging: *default-logging

  api:
    build:
      context: ./backend
    image: cab-booking-api:dev
    restart: unless-stopped
    environment:
      ENV: ${ENV:-prod}
      DATABASE_URL: "postgresql+asyncpg://app_user:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env (run make init)}@db:5432/cab_booking"
      MIGRATION_DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?}@db:5432/cab_booking"
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env (run make init)}"
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      PLATFORM_BASE_DOMAIN: ${PLATFORM_BASE_DOMAIN:-localhost}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      FORWARDED_ALLOW_IPS: "*"
      GUNICORN_WORKER_CLASS: uvicorn_worker.UvicornWorker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - edge
    logging: *default-logging

  web:
    build:
      context: ./frontend
    image: cab-booking-web:dev
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      # Extra listener for hosts where :80 is taken (set SITE_ADDRESS=:8080).
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - edge
    logging: *default-logging

volumes:
  db_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  backend:
    internal: true
